[package]
name = "logshield-ingest"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/neonjava/logshield-tacg"
description = "Authenticated Rust event ingestion client and file agent for LogShield TACG"

[dependencies]
logshield-core = { path = "../logshield-core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"

[[bin]]
name = "logshield-agent"
path = "src/main.rs"
