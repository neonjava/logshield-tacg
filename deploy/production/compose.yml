name: logshield-private
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/production/Api.Dockerfile
    image: logshield-api:private
    command: ["logshield-api"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      LAB_MODE: "false"
      API_BIND: "0.0.0.0:3000"
      DATABASE_URL: "sqlite:///state/logshield.db?mode=rwc"
      LOG_DIR: /logs
      LOGSHIELD_OPERATOR_TOKEN: ${LOGSHIELD_OPERATOR_TOKEN:?set operator token}
      LOGSHIELD_VIEWER_TOKEN: ${LOGSHIELD_VIEWER_TOKEN:?set viewer token}
      LOGSHIELD_INGEST_TOKENS: ${LOGSHIELD_INGEST_TOKENS:?set source token JSON}
    volumes:
      - evidence:/state
      - app-logs:/logs:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks: [control, management]
    healthcheck:
      test: ["CMD", "logshield-api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    build:
      context: ../..
      dockerfile: deploy/production/Proxy.Dockerfile
    image: logshield-proxy:private
    restart: unless-stopped
    user: ${LOGSHIELD_PROXY_UID:-1000:1000}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777, /var/cache/nginx:mode=1777]
    environment:
      LOGSHIELD_VIEWER_TOKEN: ${LOGSHIELD_VIEWER_TOKEN:?set viewer token}
    volumes:
      - ./secrets/tls.crt:/run/secrets/tls.crt:ro,Z
      - ./secrets/tls.key:/run/secrets/tls.key:ro,Z
      - ./secrets/htpasswd:/run/secrets/htpasswd:ro,Z
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, control]
    healthcheck:
      test: ["CMD-SHELL", "nc -w 1 127.0.0.1 8443 </dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
networks:
  edge: {}
  management: {}
  control:
    internal: true
volumes:
  evidence: {}
  app-logs: {}
